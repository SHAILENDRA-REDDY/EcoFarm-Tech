name: Feature request
description: Suggest an improvement or a new section for the prototype
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Eco Farm Tech is a student venture prototype. Ideas that strengthen the
        technical, financial or environmental case for the concept are especially welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Farmers cannot see how much a battery saves them each month...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Add a battery savings card on the Solar Power page...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Monitoring & dashboard
        - Financial / business model
        - Environmental impact
        - Accessibility & responsive design
        - Documentation & tooling
        - Deployment (Docker / CI)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
