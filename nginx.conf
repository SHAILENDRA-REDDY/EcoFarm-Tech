server {
    # IPv4 only. Many container runtimes run with IPv6 disabled inside the
    # bridge network; binding [::] there makes nginx exit immediately with
    # "socket() [::]:8080 failed (97: Address family not supported by protocol)".
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Security headers (the site is fully static and same-origin)
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"     always;

    # Never cache the HTML shell so deployments are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Long-lived caching for fingerprinted-ish static assets
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Container health probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Router: hash-based routes all resolve to the single shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
