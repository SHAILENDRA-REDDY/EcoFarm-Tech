name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/app.js

      - name: Repository and HTML checks
        run: node scripts/check-files.mjs

      - name: Confirm no runtime dependencies are referenced
        run: |
          if grep -RInE 'node_modules|unpkg\.com|cdn\.jsdelivr\.net' index.html css js; then
            echo "::error::The site must not depend on third-party runtime code."
            exit 1
          fi
          echo "No third-party runtime dependencies found."

  docker:
    name: Build container
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ecofarm-tech/dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name ecofarm-ci -p 8080:8080 ecofarm-tech/dashboard:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Eco Farm Tech"; then
              echo "Container is serving the dashboard."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container did not serve the dashboard in time."
          docker logs ecofarm-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f ecofarm-ci || true
